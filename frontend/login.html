<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <script>
        (function() {
            try {
                if (localStorage.getItem('currentUser') && localStorage.getItem('authToken')) {
                    window.location.href = 'index.html';
                }
            } catch (e) {}
        })();
    </script>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng nhập - Hệ thống IoT</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    
    <script src="https://unpkg.com/@phosphor-icons/web"></script>
    
    <link rel="stylesheet" href="src/styles/main.css">
    <link rel="stylesheet" href="src/styles/login.css">
</head>
<body class="login-page">

    <div class="login-card-container">
        <div class="login-header">
            <div class="login-logo">
                <i class="ph-fill ph-house-line"></i>
            </div>
            <h1 class="login-title">Đăng nhập hệ thống</h1>
        </div>

        <form id="loginForm" onsubmit="handleLogin(event)">
            <div class="form-group">
                <label class="form-label" for="username">Tên đăng nhập / Email</label>
                <div class="input-wrapper">
                    <input 
                        type="text" 
                        id="username" 
                        class="form-input" 
                        placeholder="Nhập tên đăng nhập (VD: B23DCCN633)..." 
                        required
                        autocomplete="username"
                    >
                    <i class="ph ph-user input-icon"></i>
                </div>
            </div>

            <div class="form-group">
                <label class="form-label" for="password">Mật khẩu</label>
                <div class="input-wrapper">
                    <input 
                        type="password" 
                        id="password" 
                        class="form-input" 
                        placeholder="Nhập mật khẩu..." 
                        required
                        autocomplete="current-password"
                    >
                    <i class="ph ph-lock-key input-icon"></i>
                    <button type="button" class="toggle-password-btn" onclick="togglePasswordVisibility()" title="Ẩn/Hiện mật khẩu">
                        <i id="passwordToggleIcon" class="ph ph-eye"></i>
                    </button>
                </div>
            </div>

            <div class="form-options">
                <label class="remember-me">
                    <input type="checkbox" id="rememberMe" checked>
                    <span>Ghi nhớ đăng nhập</span>
                </label>
            </div>

            <button type="submit" id="submitBtn" class="btn-submit">
                <i class="ph-bold ph-sign-in"></i>
                <span>Đăng nhập</span>
            </button>
        </form>
    </div>

    <div id="toast-container"></div>

    <script src="src/config/app.config.js"></script>
    <script src="src/components/toast.component.js"></script>
    <script src="src/api/http.service.js"></script>
    <script src="src/pages/login.js"></script>
</body>
</html>
